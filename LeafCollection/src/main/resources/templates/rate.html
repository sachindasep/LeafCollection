<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/header :: header"></div>
</head>

<body>
<!-- topbar starts -->
<div th:replace="fragments/topbar :: topbar"></div>
<!-- topbar ends -->
<div class="ch-container">
    <div class="row">

        <!-- left menu starts -->
        <div th:replace="fragments/sidebar :: sidebar"></div>
        <!-- left menu ends -->

        <noscript>
            <div class="alert alert-block col-md-12">
                <h4 class="alert-heading">Warning!</h4>

                <p>You need to have <a href="http://en.wikipedia.org/wiki/JavaScript" target="_blank">JavaScript</a>
                    enabled to use this site.</p>
            </div>
        </noscript>

        <div id="content" class="col-lg-10 col-sm-10">
            <!-- content starts -->
            <div>
                <ul class="breadcrumb">
                    <li>
                        <a href="#">Home</a>
                    </li>
                    <li>
                        <a href="#">Set Monthly Rate</a>
                    </li>
                </ul>
            </div>

            <div class="row">
                <div class="box col-md-12">
                    <div class="box-inner">
                        <div class="box-header well" data-original-title="">
                            <h2><i class="glyphicon glyphicon-edit"></i> Set Monthly Rate</h2>

                            <div class="box-icon">
                                <a href="#" class="btn btn-setting btn-round btn-default"><i
                                        class="glyphicon glyphicon-cog"></i></a>
                                <a href="#" class="btn btn-minimize btn-round btn-default"><i
                                        class="glyphicon glyphicon-chevron-up"></i></a>
                                <a href="#" class="btn btn-close btn-round btn-default"><i
                                        class="glyphicon glyphicon-remove"></i></a>
                            </div>
                        </div>
                        <div class="box-content">
                            <form th:action="@{/rate/load}" method="get" class="form-horizontal">
                                <div class="form-group">
                                    <label for="branchId" class="col-sm-2 control-label">
                                        <strong>Select Branch</strong>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <div class="col-sm-4">
                                        <select id="branchId" name="branchId" class="form-control" data-rel="chosen" required>
                                            <option value="">-- Select Branch --</option>
                                            <option th:each="b : ${branches}"
                                                    th:value="${b.id}"
                                                    th:text="${b.name}"
                                                    th:selected="${b.id == selectedBranch}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="month" class="col-sm-2 control-label">
                                        <strong>Month</strong>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <div class="col-sm-4">
                                        <input type="month" name="month" id="month" class="form-control" th:value="${selectedMonth}" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-offset-2 col-sm-4">
                                        <button type="submit" class="btn btn-primary">Load</button>
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
                <!--/span-->
                <div th:if="${selectedBranch != null}">
                    <div class="box col-md-12">
                        <div class="box-inner">
                            <div class="box-header well" data-original-title="">
                                <h2><i class="glyphicon glyphicon-edit"></i> Enter Rate</h2>
                                <p th:if="${selectedBranchName != null and selectedMonth != null}">
                                    <strong>Branch:</strong> <span th:text="${selectedBranchName}"></span> |
                                    <strong>Month:</strong> <span th:text="${selectedMonth}"></span>
                                </p>

                                <div class="box-icon">
                                    <a href="#" class="btn btn-setting btn-round btn-default"><i
                                            class="glyphicon glyphicon-cog"></i></a>
                                    <a href="#" class="btn btn-minimize btn-round btn-default"><i
                                            class="glyphicon glyphicon-chevron-up"></i></a>
                                    <a href="#" class="btn btn-close btn-round btn-default"><i
                                            class="glyphicon glyphicon-remove"></i></a>
                                </div>
                            </div>
                            <div class="box-content">
                                <div th:if="${param.success != null}" class="alert alert-success">
                                    <strong>Success!</strong> Rate saved/updated successfully.
                                </div>
                                <form th:action="@{/rate/save}" method="post" class="form-horizontal">
                                    <input type="hidden" name="branchId" th:value="${selectedBranch}"/>
                                    <input type="hidden" name="month" th:value="${selectedMonth}"/>

                                    <div class="form-group">
                                        <label for="rate" class="col-sm-2 control-label">
                                            <strong>Rate</strong>
                                            <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-sm-4">
                                            <input type="number" step="0.01" name="rate" id="rate"
                                                   th:value="${existingRate}" class="form-control" required/>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <div class="col-sm-offset-2 col-sm-4">
                                            <button type="submit" class="btn btn-primary">Save / Update Rate</button>
                                        </div>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div><!--/row-->
            <hr>

            <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
                 aria-hidden="true">

                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal">×</button>
                            <h3>Settings</h3>
                        </div>
                        <div class="modal-body">
                            <p>Here settings can be configured...</p>
                        </div>
                        <div class="modal-footer">
                            <a href="#" class="btn btn-default" data-dismiss="modal">Close</a>
                            <a href="#" class="btn btn-primary" data-dismiss="modal">Save changes</a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="fragments/footer :: footer"></div>

        </div><!--/.fluid-container-->

        <!-- external javascript -->
        <div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
