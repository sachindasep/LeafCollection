
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/header :: header"></div>
</head>

<body>
<!-- topbar starts -->
<div th:replace="fragments/topbar :: topbar"></div>
<!-- topbar ends -->
<div class="ch-container">
    <div class="row">

        <!-- left menu starts -->
        <div th:replace="fragments/sidebar :: sidebar"></div>
        <!-- left menu ends -->

        <noscript>
            <div class="alert alert-block col-md-12">
                <h4 class="alert-heading">Warning!</h4>

                <p>You need to have <a href="http://en.wikipedia.org/wiki/JavaScript" target="_blank">JavaScript</a>
                    enabled to use this site.</p>
            </div>
        </noscript>

        <div id="content" class="col-lg-10 col-sm-10">
            <!-- content starts -->
            <div>
                <ul class="breadcrumb">
                    <li>
                        <a href="#">Home</a>
                    </li>
                    <li>
                        <a href="#">Set Monthly Rate</a>
                    </li>
                </ul>
            </div>

            <div class="row">
                <div class="box col-md-12">
                    <div class="box-inner">
                        <div class="box-header well" data-original-title="">
                            <h2><i class="glyphicon glyphicon-edit"></i> Set Monthly Rate</h2>

                            <div class="box-icon">
                                <a href="#" class="btn btn-setting btn-round btn-default"><i
                                        class="glyphicon glyphicon-cog"></i></a>
                                <a href="#" class="btn btn-minimize btn-round btn-default"><i
                                        class="glyphicon glyphicon-chevron-up"></i></a>
                                <a href="#" class="btn btn-close btn-round btn-default"><i
                                        class="glyphicon glyphicon-remove"></i></a>
                            </div>
                        </div>
                        <div class="box-content">
                            <form th:action="@{/rate/load}" method="get">
                                <div class="control-group">
                                    <label class="control-label" for="branchId">Select Branch</label>

                                    <div class="controls">
                                        <select id="branchId" name="branchId" data-rel="chosen" required>
                                            <option value="">-- Select Branch --</option>
                                            <option th:each="b : ${branches}"
                                                    th:value="${b.id}"
                                                    th:text="${b.name}"
                                                    th:selected="${b.id == selectedBranch}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="month">Month</label>
                                    <input type="month" name="month" id="month" required>
                                </div>

                                <button type="submit" class="btn btn-default">Load</button>
                            </form>

                        </div>
                    </div>
                </div>
                <!--/span-->
                <div th:if="${selectedBranch != null}">
                    <div class="box col-md-12">
                        <div class="box-inner">
                            <div class="box-header well" data-original-title="">
                                <h2><i class="glyphicon glyphicon-edit"></i> Enter Rate</h2>

                                <div class="box-icon">
                                    <a href="#" class="btn btn-setting btn-round btn-default"><i
                                            class="glyphicon glyphicon-cog"></i></a>
                                    <a href="#" class="btn btn-minimize btn-round btn-default"><i
                                            class="glyphicon glyphicon-chevron-up"></i></a>
                                    <a href="#" class="btn btn-close btn-round btn-default"><i
                                            class="glyphicon glyphicon-remove"></i></a>
                                </div>
                            </div>
                            <div class="box-content">
                                <form th:action="@{/rate/save}" method="post">
                                    <input type="hidden" name="branchId" th:value="${selectedBranch}"/>
                                    <input type="hidden" name="month" th:value="${selectedMonth}"/>

                                    <div class="form-group">
                                        <label for="rate">Rate</label>
                                        <input type="number" step="0.01" name="rate"
                                               th:value="${existingRate}" required/>
                                    </div>

                                    <button type="submit" class="btn btn-default">Save / Update Rate</button>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div><!--/row-->
            <hr>

            <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
                 aria-hidden="true">

                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal">×</button>
                            <h3>Settings</h3>
                        </div>
                        <div class="modal-body">
                            <p>Here settings can be configured...</p>
                        </div>
                        <div class="modal-footer">
                            <a href="#" class="btn btn-default" data-dismiss="modal">Close</a>
                            <a href="#" class="btn btn-primary" data-dismiss="modal">Save changes</a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="fragments/footer :: footer"></div>

        </div><!--/.fluid-container-->

        <!-- external javascript -->
        <div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
