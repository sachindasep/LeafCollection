<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/header :: header"></div>
</head>

<body>
<!-- topbar starts -->
<div th:replace="fragments/topbar :: topbar"></div>
<!-- topbar ends -->
<div class="ch-container">
    <div class="row">

        <!-- left menu starts -->
        <div th:replace="fragments/sidebar :: sidebar"></div>
        <!-- left menu ends -->

        <noscript>
            <div class="alert alert-block col-md-12">
                <h4 class="alert-heading">Warning!</h4>

                <p>You need to have <a href="http://en.wikipedia.org/wiki/JavaScript" target="_blank">JavaScript</a>
                    enabled to use this site.</p>
            </div>
        </noscript>

        <div id="content" class="col-lg-10 col-sm-10">
            <!-- content starts -->
            <div>
                <ul class="breadcrumb">
                    <li>
                        <a href="#">Home</a>
                    </li>
                    <li>
                        <a href="#">Billing</a>
                    </li>
                </ul>
            </div>
            <div class="row">
                <div class="box col-md-12">
                    <div class="box-inner">
                        <div class="box-header well" data-original-title="">
                            <h2><i class="glyphicon glyphicon-edit"></i> Add New Party</h2>

                            <div class="box-icon">
                            </div>
                        </div>
                        <div class="box-content">
                            <form th:action="@{/billing/generate}" method="post" class="form-horizontal">
                                <div class="form-group">
                                    <label for="branchId" class="col-sm-2 control-label">
                                        <strong>Branch</strong>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <div class="col-sm-4">
                                        <select id="branchId" name="branchId" class="form-control" data-rel="chosen" required>
                                            <option value="">-- Select Branch --</option>
                                            <option th:each="b : ${branches}"
                                                    th:value="${b.id}"
                                                    th:text="${b.name}"
                                                    th:selected="${b.id == selectedBranch}">
                                            </option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="month" class="col-sm-2 control-label">
                                        <strong>Month</strong>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <div class="col-sm-4">
                                        <input type="month" id="month" name="month" class="form-control" th:value="${selectedMonth}" required/>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="col-sm-offset-2 col-sm-4">
                                        <button type="submit" class="btn btn-primary">Generate</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!--/span-->
            <div class="box col-md-12">
                <div class="box-inner">
                    <div class="box-header well" data-original-title="">
                        <h2><i class="glyphicon glyphicon-user"></i>
                            Bill for
                            <span th:if="${selectedBranchName != null}" th:text="${selectedBranchName}"></span>
                            <span th:if="${selectedMonth != null}" th:text="'(' + ${selectedMonth} + ')'"></span>
                        </h2>

                        <div class="box-icon">
                            <a href="#" class="btn btn-minimize btn-round btn-default"><i
                                    class="glyphicon glyphicon-chevron-up"></i></a>
                        </div>
                    </div>
                    <div class="box-content">
                        <div class="table-responsive">
                            <table class="table table-striped table-bordered bootstrap-datatable datatable">
                                <thead>
                                <tr>
                                    <th style="text-align: center;">Party</th>
                                    <th style="text-align: right;">Opening</th>
                                    <th style="text-align: right;">Qty</th>
                                    <th style="text-align: right;">Rate</th>
                                    <th style="text-align: right;">Amount</th>
                                    <th style="text-align: right;">Payment</th>
                                    <th style="text-align: right;">Net Balance</th>
                                    <th style="text-align: right;">Paid</th>
                                    <th style="text-align: center;">Status</th>
                                    <th style="text-align: center;">Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="a : ${accounts}">
                                    <td th:text="${a.partyName}"></td>
                                    <td style="text-align: right;" th:text="${a.openingBalance}"></td>
                                    <td style="text-align: right;" th:text="${a.totalQuantity}"></td>
                                    <td style="text-align: right;" th:text="${a.rate}"></td>
                                    <td style="text-align: right;" th:text="${a.totalAmount}"></td>
                                    <td style="text-align: right;" th:text="${a.totalPayment}"></td>
                                    <td style="text-align: right;" th:text="${a.netBalance}"></td>
                                    <td style="text-align: right;" th:text="${a.actualPaid}"></td>
                                    <td style="text-align: center;" th:text="${a.status}"></td>
                                    <td style="text-align: center;">
                                        <button type="button"
                                                class="btn btn-primary btn-sm"
                                                th:attr="onclick=|printIndividualBill('${a.partyName}',
                                                  '${a.partyCode}',
                                                  '${selectedMonth}',
                                                  '${a.openingBalance}',
                                                  '${a.totalQuantity}',
                                                  '${a.rate}',
                                                  '${a.totalAmount}',
                                                  '${a.totalPayment}',
                                                  '${a.netBalance}')|">
                                            <i class="glyphicon glyphicon-print"></i> Print
                                        </button>
                                        <button class="btn btn-success btn-sm"
                                                th:if="${a.status == 'FINAL'}"
                                                th:attr="onclick=|openSettlementPopup(${a.id}, '${a.netBalance}')|">
                                            Settle
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                                <tfoot>
                                <tr style="font-weight: bold;">
                                    <td><strong>Total</strong></td>
                                    <td style="text-align: right;"><strong th:text="${totalOpening}"></strong></td>
                                    <td style="text-align: right;"><strong th:text="${totalQty}"></strong></td>
                                    <td style="text-align: right;"><strong>-</strong></td>
                                    <td style="text-align: right;"><strong th:text="${totalAmount}"></strong></td>
                                    <td style="text-align: right;"><strong th:text="${totalPayment}"></strong></td>
                                    <td style="text-align: right;"><strong th:text="${totalNet}"></strong></td>
                                    <td style="text-align: center;"><strong>-</strong></td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                        <div style="margin-top: 20px;">
                            <form th:action="@{/billing/finalize}" method="post" class="form-inline">
                                <input type="hidden" name="branchId" th:value="${selectedBranch}"/>
                                <input type="hidden" name="month" th:value="${selectedMonth}"/>
                                <button type="submit" class="btn btn-success">
                                    <i class="glyphicon glyphicon-ok"></i> Finalize
                                </button>
                                <button type="button" class="btn btn-info" style="margin-left: 10px;" onclick="printBillingTable()">
                                    <i class="glyphicon glyphicon-print"></i> Monthly Print
                                </button>
                                <button type="button"
                                        class="btn btn-warning"
                                        style="margin-left: 10px;"
                                        onclick="bulkPrintBills()">
                                    <i class="glyphicon glyphicon-print"></i> Bulk Print
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div><!--/row-->
        <hr>

        <div class="modal fade" id="settleModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4>Settle Bill</h4>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="accountId"/>

                        <label>Amount Paid</label>
                        <input type="number" id="paidAmount" class="form-control"/>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary" onclick="submitSettlement()">OK</button>
                        <button class="btn btn-default" data-dismiss="modal">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="fragments/footer :: footer"></div>

    </div><!--/.fluid-container-->

    <!-- external javascript -->
    <div th:replace="fragments/scripts :: scripts"></div>


    <script th:inline="javascript">
        const accountsData = /*[[${accounts}]]*/ [];
        const selectedMonth = /*[[${selectedMonth}]]*/ '';
    </script>

    <script>
        function openSettlementPopup(id, netBalance) {
            document.getElementById("accountId").value = id;
            document.getElementById("paidAmount").value = netBalance;

            $('#settleModal').modal('show');
        }

        function submitSettlement() {

            const id = document.getElementById("accountId").value;
            const amount = document.getElementById("paidAmount").value;

            fetch('/billing/settle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id, amount: amount })
            })
                .then(res => {
                    if (!res.ok) {
                        throw new Error("Failed to settle");
                    }
                   // return res.text(); // ✅ safer
                })
                .then(() => {
                    alert("Settlement Done!");
                    location.reload();
                })
                .catch(err => {
                    console.error(err);
                    alert("Settlement failed!");
                });
        }

        function printBillingTable() {
            // Safely get values
            const branchEl = document.querySelector('h2 span:nth-child(2)');
            const monthEl = document.querySelector('h2 span:nth-child(3)');
            const tableEl = document.querySelector('.table-striped');

            const branchName = branchEl ? branchEl.innerText.trim() : 'N/A';
            const month = monthEl ? monthEl.innerText.trim() : 'N/A';

            if (!tableEl) {
                alert("Table not found!");
                return;
            }
            const clonedTable = tableEl.cloneNode(true);


// Remove last 2 columns
            clonedTable.querySelectorAll("tr").forEach(row => {
                if (row.cells.length >= 2) {
                    row.deleteCell(-1); // remove last column
                    row.deleteCell(-1); // remove second last column
                }
            });


            const table = clonedTable.outerHTML;

            const printWindow = window.open('', '_blank', 'width=900,height=700');

            printWindow.document.open();
            printWindow.document.write(`
        <html>
        <head>
            <title>Monthly Billing Report</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    margin: 20px;
                }
                .print-header {
                    text-align: center;
                    margin-bottom: 20px;
                    border-bottom: 2px solid #000;
                    padding-bottom: 10px;
                }
                table {
                    width: 100%;
                    border-collapse: collapse;
                }
                th, td {
                    border: 1px solid #000;
                    padding: 8px;
                }
                th {
                    background-color: #eee;
                }
                tfoot td {
                    font-weight: bold;
                }
                .text-right {
                    text-align: right;
                }
                .text-center {
                    text-align: center;
                }
            </style>
        </head>
        <body>
            <div class="print-header">
                <h2>Billing Report</h2>
                <p><strong>Branch:</strong> ${branchName}</p>
                <p><strong>Month:</strong> ${month}</p>
            </div>

            ${table}
        </body>
        </html>
    `);

            printWindow.document.close();

            // Wait for content to load before printing
            printWindow.onload = function () {
                printWindow.focus();
                printWindow.print();
                printWindow.close();
            };
        }
        function printIndividualBill(name, code, month, opening, qty, rate, amount, payment, closing) {

            function format(val) {
                return parseFloat(val || 0).toFixed(2);
            }

            const printWindow = window.open('', '_blank', 'width=400,height=600');

            printWindow.document.write(`
    <html>
    <head>
        <title>Individual Bill</title>
        <style>
            body {
                font-family: monospace;
                font-size: 14px;
                padding: 10px;
            }
            pre {
                line-height: 1.4;
            }
        </style>
    </head>
    <body>
<pre>
          PALAKKAL AGENCIES
              VELLACHAL
 Mob : 9495258812        Shop : 04936 262736
                         Resi :       262436
 -------------------------------------------
 Name  : ${name}
 Code  : ${code}
 Month : ${formatMonth(month)}
 -------------------------------------------
 Opening Balance                 ${format(opening)}
 Nt. Wt.   Rate     Amount          Payment
 -------------------------------------------
 ${format(qty).padStart(8)}   ${format(rate).padStart(6)}   ${format(amount).padStart(8)}   ${format(payment).padStart(8)}
 ===========================================
 Closing Balance                ${format(closing)}
 ===========================================
</pre>
    </body>
    </html>
    `);

            printWindow.document.close();

            printWindow.onload = function () {
                printWindow.print();
                printWindow.close();
            };
        }
        function formatMonth(monthStr) {
            const date = new Date(monthStr + "-01");
            return date.toLocaleString('en-US', { month: 'long', year: 'numeric' });
        }

        /// bulk  logic**************************

        function bulkPrintBills() {

            function format(val) {
                return parseFloat(val || 0).toFixed(2);
            }

            function formatMonth(monthStr) {
                const date = new Date(monthStr + "-01");
                return date.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            }

            let content = "";
            const finalBills = accountsData.filter(a => a.status === 'FINAL');

            if (finalBills.length === 0) {
                alert("No FINAL bills available!");
                return;
            }

            finalBills.forEach(a => {

                content += `
<pre>
          PALAKKAL AGENCIES
              VELLACHAL
 Mob : 9495258812        Shop : 04936 262736
                         Resi :       262436
 -------------------------------------------
 Name  : ${a.partyName}
 Code  : ${a.partyCode}
 Month : ${formatMonth(selectedMonth)}
 -------------------------------------------
 Opening Balance                 ${format(a.openingBalance)}
 Nt. Wt.   Rate     Amount          Payment
 -------------------------------------------
 ${format(a.totalQuantity).padStart(8)}   ${format(a.rate).padStart(6)}   ${format(a.totalAmount).padStart(8)}   ${format(a.totalPayment).padStart(8)}
 ===========================================
 Closing Balance                ${format(a.netBalance)}
 ===========================================
</pre>

<br><br>
        `;
            });

            const printWindow = window.open('', '_blank', 'width=800,height=700');

            printWindow.document.write(`
        <html>
        <head>
            <title>Bulk Bills</title>
            <style>
                body {
                    font-family: monospace;
                    font-size: 14px;
                }
                pre {
                    margin: 0;
                }
                @media print {
                    div {
                        page-break-after: always;
                    }
                }
            </style>
        </head>
        <body>
            ${content}
        </body>
        </html>
    `);

            printWindow.document.close();

            printWindow.onload = function () {
                printWindow.focus();
                printWindow.print();
                printWindow.close();
            };
        }
    </script>

</body>
</html>
