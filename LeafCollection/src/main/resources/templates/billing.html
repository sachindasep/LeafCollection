<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/header :: header"></div>
</head>

<body>
<!-- topbar starts -->
<div th:replace="fragments/topbar :: topbar"></div>
<!-- topbar ends -->
<div class="ch-container">
    <div class="row">

        <!-- left menu starts -->
        <div th:replace="fragments/sidebar :: sidebar"></div>
        <!-- left menu ends -->

        <noscript>
            <div class="alert alert-block col-md-12">
                <h4 class="alert-heading">Warning!</h4>

                <p>You need to have <a href="http://en.wikipedia.org/wiki/JavaScript" target="_blank">JavaScript</a>
                    enabled to use this site.</p>
            </div>
        </noscript>

        <div id="content" class="col-lg-10 col-sm-10">
            <!-- content starts -->
            <div>
                <ul class="breadcrumb">
                    <li>
                        <a href="#">Home</a>
                    </li>
                    <li>
                        <a href="#">Billing</a>
                    </li>
                </ul>
            </div>
            <div class="row">
                <div class="box col-md-12">
                    <div class="box-inner">
                        <div class="box-header well" data-original-title="">
                            <h2><i class="glyphicon glyphicon-edit"></i> Add New Party</h2>

                            <div class="box-icon">
                            </div>
                        </div>
                        <div class="box-content">
                            <form th:action="@{/billing/generate}" method="post">

                                <label>Branch:</label>
                                <select name="branchId">
                                    <option th:each="b : ${branches}"
                                            th:value="${b.id}"
                                            th:text="${b.name}">
                                    </option>
                                </select>

                                <label>Month:</label>
                                <input type="month" name="month" required/>

                                <button type="submit" class="btn btn-default">Generate</button>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!--/span-->
            <div class="box col-md-12">
                <div class="box-inner">
                    <div class="box-header well" data-original-title="">
                        <h2><i class="glyphicon glyphicon-user"></i> Party List</h2>

                        <div class="box-icon">
                            <a href="#" class="btn btn-minimize btn-round btn-default"><i
                                    class="glyphicon glyphicon-chevron-up"></i></a>
                        </div>
                    </div>
                    <div class="box-content">
                        <table class="table table-striped table-bordered bootstrap-datatable datatable responsive">
                            <thead>
                            <tr>
                                <th>Party</th>
                                <th>Opening</th>
                                <th>Qty</th>
                                <th>Rate</th>
                                <th>Amount</th>
                                <th>Payment</th>
                                <th>Net Balance</th>
                                <th>Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="a : ${accounts}">
                                <td th:text="${a.party.name}"></td>
                                <td th:text="${a.openingBalance}"></td>
                                <td th:text="${a.totalQuantity}"></td>
                                <td th:text="${a.rate}"></td>
                                <td th:text="${a.totalAmount}"></td>
                                <td th:text="${a.totalPayment}"></td>
                                <td th:text="${a.netBalance}"></td>
                                <td th:text="${a.status}"></td>
                            </tr>
                            </tbody>
                            <tfoot>
                            <tr style="font-weight:bold;">
                                <td>Total</td>
                                <td th:text="${totalOpening}"></td>
                                <td th:text="${totalQty}"></td>
                                <td>-</td>
                                <td th:text="${totalAmount}"></td>
                                <td th:text="${totalPayment}"></td>
                                <td th:text="${totalNet}"></td>
                                <td>-</td>
                            </tr>
                            </tfoot>
                        </table>
                        <form th:action="@{/billing/finalize}" method="post">
                            <input type="hidden" name="branchId" th:value="${selectedBranch}"/>
                            <input type="hidden" name="month" th:value="${selectedMonth}"/>

                            <button type="submit" class="btn btn-default">Finalize</button>
                        </form>
                    </div>
                </div>
            </div>
        </div><!--/row-->
        <hr>

        <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
             aria-hidden="true">

            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal">×</button>
                        <h3>Next release Feature</h3>
                    </div>
                    <div class="modal-body">
                        <p>Stay Tuned Will be available in next release</p>
                    </div>
                    <div class="modal-footer">
                        <a href="#" class="btn btn-default" data-dismiss="modal">Close</a>
                        <a href="#" class="btn btn-primary" data-dismiss="modal">Save changes</a>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="fragments/footer :: footer"></div>

    </div><!--/.fluid-container-->

    <!-- external javascript -->
    <div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
