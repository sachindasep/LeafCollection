<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/header :: header"></div>
</head>

<body>
<!-- topbar starts -->
<div th:replace="fragments/topbar :: topbar"></div>
<!-- topbar ends -->
<div class="ch-container">
    <div class="row">

        <!-- left menu starts -->
        <div th:replace="fragments/sidebar :: sidebar"></div>
        <!-- left menu ends -->

        <noscript>
            <div class="alert alert-block col-md-12">
                <h4 class="alert-heading">Warning!</h4>

                <p>You need to have <a href="http://en.wikipedia.org/wiki/JavaScript" target="_blank">JavaScript</a>
                    enabled to use this site.</p>
            </div>
        </noscript>

        <div id="content" class="col-lg-10 col-sm-10">
            <!-- content starts -->
            <div>
                <ul class="breadcrumb">
                    <li>
                        <a href="#">Home</a>
                    </li>
                    <li>
                        <a href="#">party payment</a>
                    </li>
                </ul>
            </div>
            <div class="row">
                <div class="box col-md-12">
                    <div class="box-inner">
                        <div class="box-header well" data-original-title="">
                            <h2><i class="glyphicon glyphicon-edit"></i> Leaf Collection</h2>

                            <div class="box-icon">
                            </div>
                        </div>
                        <div class="box-content">
                            <form th:action="@{/payments/save}" method="post">
                                <!-- <input type="hidden" th:field="*{id}" />-->
                                <div class="form-group">
                                    <label for="paymentDate">Entry Date</label>
                                    <input type="date" name="paymentDate" placeholder="Enter Date"
                                           id="paymentDate" required>
                                </div>
                            <!--    <div class="control-group">
                                    <label class="control-label" for="branchId">Select Branch</label>

                                    <div class="controls">
                                        <select id="branchId" name="branchId" data-rel="chosen">
                                            <option value="">&#45;&#45; Select Branch &#45;&#45;</option>
                                            <option th:each="b : ${branches}"
                                                    th:value="${b.id}"
                                                    th:text="${b.name}">
                                            </option>
                                        </select>
                                    </div>
                                </div>-->
                                <div class="control-group">
                                    <label class="control-label" for="partyId">Select Party</label>

                                    <div class="controls">
                                        <select id="partyId" name="partyId" data-rel="chosen">
                                            <option value="">-- Select Party --</option>
                                            <option th:each="p : ${parties}"
                                                    th:value="${p.id}"
                                                    th:text="${p.partyCode + ' - ' + p.name}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="quantity">Amount</label>
                                    <input type="number" step="0.01" name="amount"
                                           placeholder="Enter Amount"
                                           id="quantity" required>
                                </div>

                                <div class="control-group">
                                    <label class="control-label" for="paymentMode">Mode:</label>

                                    <div class="controls">
                                        <select id="paymentMode" name="paymentMode" data-rel="chosen">
                                            <option value="CASH">Cash</option>
                                            <option value="UPI">UPI</option>
                                            <option value="BANK_TRANSFER">Bank</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="remarks">Remarks</label>
                                    <input type="text" name="remarks"
                                           placeholder="Enter remarks"
                                           id="remarks">
                                </div>


                                <button type="submit" class="btn btn-default">Save Payment</button>

                            </form>
                        </div>

                    </div>
                </div>
            </div>
            <!--/span-->
            <div class="row">
                <div class="box col-md-12">
                    <div class="box-inner">
                        <div class="box-header well" data-original-title="">
                            <h2><i class="glyphicon glyphicon-user"></i> Today's Payment</h2>

                            <div class="box-icon">
                                <a href="#" class="btn btn-minimize btn-round btn-default"><i
                                        class="glyphicon glyphicon-chevron-up"></i></a>
                            </div>
                        </div>
                        <div class="box-content">
                            <div class="alert alert-info">
                                <strong>Today's Total Payment: </strong>
                                <span th:text="${todayTotal != null ? todayTotal + ' RS' : '0 RS'}"></span>
                            </div>
                            <table class="table table-striped table-bordered bootstrap-datatable datatable responsive">
                                <thead>
                                <tr>
                                    <th>Party</th>
                                    <th>Branch</th>
                                    <th>Amount</th>
                                    <th>Mode</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="today : ${todayPayments}">
                                    <td th:text="${today.party.name}"></td>
                                    <td th:text="${today.party.branch.name}"></td>
                                    <td th:text="${today.amount}"></td>
                                    <td th:text="${today.paymentMode}"></td>
                                    <td class="center">

                                        <a class="btn btn-info" th:href="@{'/payments/edit/' + ${today.id}}">
                                            <i class="glyphicon glyphicon-edit icon-white"></i>
                                            Edit
                                        </a>

                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div><!--/row-->

        <hr>

        <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
             aria-hidden="true">

            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal">×</button>
                        <h3>Next release Feature</h3>
                    </div>
                    <div class="modal-body">
                        <p>Stay Tuned Will be available in next release</p>
                    </div>
                    <div class="modal-footer">
                        <a href="#" class="btn btn-default" data-dismiss="modal">Close</a>
                        <a href="#" class="btn btn-primary" data-dismiss="modal">Save changes</a>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="fragments/footer :: footer"></div>

    </div><!--/.fluid-container-->

    <!-- external javascript -->
    <div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
